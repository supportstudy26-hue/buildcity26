<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build City 26 · Đo hiệu năng riêng</title><link rel="stylesheet" href="/src/style.css"><style>.benchmark-panel{position:absolute;z-index:5;top:16px;left:16px;width:340px;max-width:calc(100vw - 32px);max-height:70dvh;overflow:auto;padding:16px}.benchmark-panel h1{font-size:18px;margin:0 0 8px}.benchmark-panel p{font-size:13px;line-height:1.5;color:var(--muted)}#results{font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap}.benchmark-controls{display:flex;gap:8px;flex-wrap:wrap}.benchmark-controls select{background:var(--panel);color:var(--text);padding:8px;border:1px solid var(--line);border-radius:8px;min-height:44px}#mini{position:absolute;right:16px;bottom:16px;border:4px solid var(--panel);border-radius:12px}.benchmark-caption{position:absolute;bottom:16px;left:16px;background:var(--panel);padding:10px;border-radius:8px;color:var(--text);font-size:12px}@media(max-width:600px){.benchmark-panel{max-height:48dvh}#mini{width:100px;height:68px}}</style></head><body><main id="game"><canvas id="world" aria-label="Bản đồ kiểm thử"></canvas><section class="panel benchmark-panel"><h1>Đo hiệu năng · Build City 26</h1><p>Thành phố kiểm thử riêng có cư dân, việc làm và chuyến đi trong core. Không ghi bản lưu, tài khoản hay BXH.</p><div class="benchmark-controls"><select id="scenario" aria-label="Kịch bản địa hình"><option value="sandbox">Cư dân đi làm</option><option value="22-start">Hạ Long · địa hình trống</option><option value="04-start">Cao Bằng · địa hình trống</option><option value="92-start">Cần Thơ · địa hình trống</option></select><select id="population" aria-label="Quy mô cư dân"><option>300</option><option selected>1000</option><option>5000</option><option>10000</option></select><select id="quality" aria-label="Chất lượng"><option value="low">Thấp</option><option value="medium" selected>Vừa</option><option value="high">Cao</option><option value="auto">Auto</option></select><button id="start" class="action primary">Đo 30 giây</button><button id="view" class="action">Góc trên</button><button id="home" class="action">Trung tâm</button><button id="night" class="action">Ngày / đêm</button><button id="panel" class="action">Thu gọn</button></div><p id="status" role="status">Sẵn sàng</p><pre id="results"></pre><a href="/" class="action">Quay về game</a></section><canvas id="mini" width="148" height="100" aria-label="Bản đồ thu nhỏ"></canvas><p class="benchmark-caption">Kéo để di chuyển · cuộn để zoom · 1 giây thực = 5 giây game</p></main><script type="module" src="/src/benchmark/page.js"></script></body></html>
